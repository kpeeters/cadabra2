# This is a build which gets triggered on every commit push, to
# ensure that we get some warnings when we push code that does
# not build on macOS.

name: macOS

on: [push]

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: macos-15
            name: macos-15
            display-name: "macOS 15 Sequoia"
          - os: macos-26
            name: macos-26
            display-name: "macOS 26 Tahoe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: get dependencies
        run: |
          brew install cmake ninja boost pcre gmp python python@3.13 \
                       pkgconfig gtkmm3 adwaita-icon-theme \
                       catch2 tbb
          python3.13 -m venv .venv
          source .venv/bin/activate
          CFLAGS="-I/opt/homebrew/include" \
          LDFLAGS="-L/opt/homebrew/lib" \
          pip install sympy gmpy2 numpy

      - name: configure
        run: |
          source .venv/bin/activate
          mkdir build && cd build && cmake -G Ninja -DENABLE_MATHEMATICA=OFF \
              -DPython_ROOT_DIR="$VIRTUAL_ENV" \
              -DPython_FIND_VIRTUALENV=ONLY \
              -DPython_CDB_EXECUTABLE=${VIRTUAL_ENV}/bin/python3.13 \
              -DPYTHON_SITE_PATH=${VIRTUAL_ENV}/lib/python3.13/site-packages/
              ..

      - name: build
        run: |
          cd build && cmake --build .

      - name: test
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          source .venv/bin/activate
          cd build && ctest ARGS="-V"
