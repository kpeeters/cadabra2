# Build PyPI wheels of the cadabra2 Python module (module, packages,
# Jupyter kernel and IPython extension only; see pyproject.toml).
# On every push to devel (and on a manual run on devel), publish them
# to TestPyPI with a development version X.Y.Z.devN, where N is the
# number of commits ('git rev-list --count HEAD'); the job summary
# shows which commit a given N corresponds to. On a pre-release,
# publish them to TestPyPI with the release version; on a full
# release, publish them to the real PyPI.
#
# To install the latest development build:
#
#    pip install -i https://test.pypi.org/simple/ \
#        --extra-index-url https://pypi.org/simple/ --pre cadabra2
#
# (the extra index is needed because the dependencies are not on
# TestPyPI).
#
# Publishing uses PyPI 'trusted publishing', which requires a one-time
# setup on *both* test.pypi.org and pypi.org (separate sites, separate
# accounts): add this repository and the workflow file 'wheels.yml' as
# a trusted publisher of the 'cadabra2' project, with environment
# 'testpypi' on TestPyPI and environment 'pypi' on PyPI.
#
# Note that uploads to PyPI are permanent: a version number can never
# be uploaded again, even after deleting it.

name: Wheels

# on: [push]

on:
  push:
    branches: [devel]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: x86_64 }
          - { os: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Every upload needs a new version number, and PyPI does not accept
    # local versions ('+sha'), so use the commit count as .devN.
    - name: Set development version
      if: github.event_name != 'release'
      run: |
        N=$(git rev-list --count HEAD)
        sed -i "s/^result = .*/result = \"{major}.{minor}.{patch}.dev${N}\"/" pyproject.toml
        grep '^result' pyproject.toml
        echo "Development version .dev${N} is commit ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.2.1
      env:
        CIBW_BUILD:             "cp310-* cp311-* cp312-* cp313-* cp314-*"
        CIBW_SKIP:              "*-musllinux_*"
        CIBW_MANYLINUX_X86_64_IMAGE:  manylinux_2_28
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        CIBW_BEFORE_ALL_LINUX:  bash {project}/.github/wheels/build-deps.sh
        CIBW_BUILD_VERBOSITY:   1
        CIBW_TEST_COMMAND:      python {project}/.github/wheels/smoke-test.py

    - name: Upload wheels as build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.name }}
        path: wheelhouse/*.whl

  publish_testpypi:
    name: Publish to TestPyPI
    needs: build_wheels
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease) ||
      (github.event_name != 'release' && github.ref == 'refs/heads/devel')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish_pypi:
    name: Publish to PyPI
    needs: build_wheels
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
