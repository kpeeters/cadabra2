# Build the docker image with a Jupyter server with Cadabra kernel
# (docker/Dockerfile), from the commit being built.
#
# On a release, the image is built for amd64 and arm64, each natively
# on its own runner (no QEMU emulation), tested, and pushed by digest
# to Docker Hub; the 'merge' job then combines the two into the
# multi-platform image kpeeters/cadabra2-jupyter:latest.
#
# On every push to devel, devel.yml calls this workflow with
# push=false, which only builds the amd64 image and tests it, without
# logging in to Docker Hub. A manual run (Actions -> Docker -> Run
# workflow) with push=true runs the full release route; note that
# this overwrites 'latest' with the image of the branch being run.
#
# The test of each image: it should import the cadabra2 module and run
# a small notebook with the cadabra2 Jupyter kernel.
#
# The layers which do not depend on the source (apt, pip) are cached
# in the GitHub Actions cache, per platform.
#
# Lint this thing with
#
#   yq eval docker.yml

name: Docker

on:
  release:
    types: [released]
  workflow_call:
    inputs:
      push:
        description: "Build for all platforms and push the image to Docker Hub."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: "Build for all platforms and push the image to Docker Hub (overwrites 'latest')."
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: kpeeters/cadabra2-jupyter
  PUSH: ${{ github.event_name == 'release' || inputs.push }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'release' || inputs.push) && '[{"arch":"amd64","os":"ubuntu-24.04"},{"arch":"arm64","os":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","os":"ubuntu-24.04"}]') }}

    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    steps:
    # Full history, so that 'git rev-list --count' in cmake/version.cmake
    # gives the real commit serial.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Build image for testing
      uses: docker/build-push-action@master
      with:
        platforms: linux/${{ matrix.arch }}
        context: .
        file: docker/Dockerfile
        load: true
        tags: cadabra2-jupyter:test
        cache-from: type=gha,scope=docker-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

    - name: Test image
      run: |
        set -e
        # Same PYTHONPATH as docker/entrypoint.sh, which is bypassed here.
        run() { docker run --rm --entrypoint "$1" -e PYTHONPATH=/usr/local/lib/python3.11/dist-packages \
                    -v "$PWD/dockertest:/test" cadabra2-jupyter:test "${@:2}"; }
        mkdir dockertest
        cat > dockertest/test.ipynb <<'EOF'
        {
         "cells": [
          {
           "cell_type": "code",
           "execution_count": null,
           "metadata": {},
           "outputs": [],
           "source": ["ex:=(A+B)(C+D);\n", "distribute(ex);\n", "print('result: '+str(ex))"]
          }
         ],
         "metadata": {"kernelspec": {"name": "cadabra2", "display_name": "Cadabra2", "language": "python"}},
         "nbformat": 4,
         "nbformat_minor": 5
        }
        EOF
        chmod -R a+rwX dockertest
        run python3 -c "import cadabra2; print('cadabra2 module ok')"
        run jupyter kernelspec list | tee dockertest/kernels.txt
        grep -q cadabra2 dockertest/kernels.txt
        run jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=cadabra2 --ExecutePreprocessor.timeout=120 \
            --output /test/out.ipynb /test/test.ipynb
        grep -o 'result: [^"]*' dockertest/out.ipynb | tee dockertest/result.txt
        grep -q 'A D' dockertest/result.txt

    - name: Log in to Docker Hub
      if: env.PUSH == 'true'
      uses: docker/login-action@master
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (labels) for Docker
      if: env.PUSH == 'true'
      id: meta
      uses: docker/metadata-action@master
      with:
        images: ${{ env.IMAGE }}

    # Same build as above (all layers come from the cache), now pushed
    # without a tag; the merge job tags the combination as 'latest'.
    - name: Push image by digest
      if: env.PUSH == 'true'
      id: push
      uses: docker/build-push-action@master
      with:
        platforms: linux/${{ matrix.arch }}
        context: .
        file: docker/Dockerfile
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=docker-${{ matrix.arch }}

    - name: Store digest
      if: env.PUSH == 'true'
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        mkdir -p digests
        touch "digests/${DIGEST#sha256:}"

    - name: Upload digest
      if: env.PUSH == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: docker-digest-${{ matrix.arch }}
        path: digests/*
        if-no-files-found: error

  # Combines the per-platform images into kpeeters/cadabra2-jupyter:latest.
  merge:
    needs: build
    if: github.event_name == 'release' || inputs.push
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: docker-digest-*
        merge-multiple: true
        path: digests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Log in to Docker Hub
      uses: docker/login-action@master
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create and push multi-platform manifest
      working-directory: digests
      run: |
        set -e
        ls
        docker buildx imagetools create -t "${IMAGE}:latest" $(printf "${IMAGE}@sha256:%s " *)
        docker buildx imagetools inspect "${IMAGE}:latest"
