# Create an Ubuntu 22.04 package on a github release event.
# This assumes that the cadabra version is the same as the
# release name, and it will attempt to add the .deb file
# to the release assets.

name: Ubuntu-22.04 package

# on: [push]

on:
 release:
   types: [created]

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: x86_64
            display-name: "Ubuntu 22.04 x86_64"
          - os: ubuntu-22.04-arm
            name: arm64
            display-name: "Ubuntu 22.04 arm64"
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3

#    - name: Exit if not on devel branch
#      if: github.ref != 'refs/heads/devel'
#      run: exit 1
      
    - name: Set up GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Authenticate GitHub CLI
      run: gh auth setup-git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    - name: Get dependencies
      run:  sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install git cmake ninja-build python3-dev g++ libgtkmm-3.0-dev libboost-all-dev libgmp-dev libsqlite3-dev uuid-dev libmpfr-dev libmpc-dev libtbb-dev catch2 && python3 --version && which python3 && python3 -m pip install --upgrade pip && python3 -m pip install wheel && python3 -m pip install sympy gmpy2 numpy

    - name: Configure
      run:  mkdir build && cd build && cmake -G Ninja -DPACKAGING_MODE=ON -DENABLE_MATHEMATICA=OFF -DUSE_GTK4=OFF -DCMAKE_INSTALL_PREFIX=/usr ..
      
    - name: Build
      run:  cd build && cmake --build .
      
    - name: Create the .deb package
      run:  cd build && cpack
      
    - name: Set version variables from output of cmake
      run: |
        VER=$(cat build/VERSION)
        echo "VERSION=$VER" >> $GITHUB_ENV

    # Used by the release-upload and test jobs below.
    - name: Store package as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-jammy-${{ matrix.name }}
        path: build/cadabra2-${{ env.VERSION }}-ubuntu-22.04-jammy-${{ matrix.name }}.deb
        if-no-files-found: error


  test:
    needs: build
    runs-on: ubuntu-22.04

    # Installs the package just built, not the one on the release page.
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: deb-jammy-x86_64

    - name: Install package
      run: |
        sudo apt -y update
        sudo apt -y install xvfb
        sudo apt -y install ./cadabra2-*-ubuntu-22.04-jammy-x86_64.deb

    - name: Test simple cli run
      run:  printf "import sys\nprint(sys.path)\nimport cdb.main\nex:=(A+B) (C+D);\ndistribute(ex);\nquit()\n" > tst.cdb && cadabra2 tst.cdb

    - name: Test gtk app launch
      run: |
        xvfb-run -a cadabra2-gtk &
        APP_PID=$!
        sleep 10
        
        if kill -0 $APP_PID 2>/dev/null; then
          echo "Application started successfully"
          kill $APP_PID
          exit 0
        else
          echo "Application failed to start"
          exit 1
        fi

  # Uploads the packages to the release once they have passed the
  # tests. This is the only job which can write to the repository.
  release-upload:
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: deb-jammy-*
        merge-multiple: true
        path: dist
    - name: Upload release assets
      run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      env:
        GH_TOKEN: ${{ github.token }}
