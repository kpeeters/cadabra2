# Create GTK4 Fedora packages on a github release event, for all
# Fedora versions listed in the matrices below (add new releases to
# both the 'build' and 'test' lists). Older Fedoras are built with
# GTK3 by the separate fedora-NN-package.yml files.
# This assumes that the cadabra version is the same as the
# release name, and it will attempt to add the .rpm files
# to the release assets.

name: Fedora package (GTK4)

# on: [push]

on:
  release:
    types: [created]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
        arch:
          - { os: ubuntu-24.04,     name: x86_64 }
          - { os: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.arch.os }}
    name: Fedora ${{ matrix.fedora }} ${{ matrix.arch.name }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull Fedora image
      run: docker pull fedora:${{ matrix.fedora }}

    - name: Set up GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Authenticate GitHub CLI
      run: gh auth setup-git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build RPM in Fedora container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           fedora:${{ matrix.fedora }} \
           bash -c "
             git config --global --add safe.directory /workspace
             dnf install -y rpm-build make gcc-c++ git python3-devel cmake gmp-devel libuuid-devel sqlite-devel openssl-devel gtkmm4.0-devel boost-devel python3-matplotlib python3-pip
             pip3 install sympy
             mkdir build
             cd build
             cmake -DPACKAGING_MODE=ON -DENABLE_MATHEMATICA=OFF -DCMAKE_INSTALL_PREFIX=/usr ..
             make
             cpack
           "

    - name: Set version variables from output of cmake
      run: |
        VER=$(cat ${{ github.workspace }}/build/VERSION)
        echo "VERSION=$VER" >> $GITHUB_ENV

    - name: Upload Release Assets
      if:   github.event_name == 'release'
      run: |
        gh release upload "${{ env.VERSION }}" build/cadabra2-${{ env.VERSION }}-fedora${{ matrix.fedora }}-${{ matrix.arch.name }}.rpm --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Store package as build artifact
      uses: actions/upload-artifact@v4
      if:   github.event_name == 'push'
      with:
        name: cadabra2-fedora${{ matrix.fedora }}-${{ matrix.arch.name }}.rpm
        path: build/cadabra2-${{ env.VERSION }}-fedora${{ matrix.fedora }}-${{ matrix.arch.name }}.rpm

  test:
    needs: build
    runs-on: ubuntu-latest
    if:   github.event_name == 'release' # only test release builds

    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    name: Test Fedora ${{ matrix.fedora }}

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull Fedora image
      run: docker pull fedora:${{ matrix.fedora }}

    - name: Download package and run inside Fedora container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           fedora:${{ matrix.fedora }} \
           bash -c "
             dnf install -y xorg-x11-server-Xvfb wget curl jq
             export VERSION=\$(curl -s https://api.github.com/repos/kpeeters/cadabra2/releases|& jq .[0].tag_name -r)
             export RPMNAME=cadabra2-\${VERSION}-fedora${{ matrix.fedora }}-x86_64.rpm
             wget https://github.com/kpeeters/cadabra2/releases/download/\${VERSION}/\${RPMNAME}
             dnf install -y \${RPMNAME}
             printf 'import sys\nprint(sys.path)\nimport cdb.main\nex:=(A+B) (C+D);\ndistribute(ex);\nquit()\n' > tst.cdb
             cadabra2 tst.cdb

             # GTK4 picks a GL/Vulkan renderer by default, which fails
             # under Xvfb; force the cairo fallback.
             export GSK_RENDERER=cairo
             xvfb-run -a cadabra2-gtk &
             APP_PID=\$!
             sleep 20
             if kill -0 \$APP_PID 2>/dev/null; then
                echo 'cadabra2-gtk started successfully'
                kill \$APP_PID
                exit 0
             else
                echo 'cadabra2-gtk failed to start'
                exit 1
             fi
           "
