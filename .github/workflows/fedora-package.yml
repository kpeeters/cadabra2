# Create GTK4 Fedora packages on a github release event, for all
# Fedora versions listed in the matrices below (add new releases to
# both the 'build' and 'test' lists). Older Fedoras are built with
# GTK3 by the separate fedora-NN-package.yml files.
# This assumes that the cadabra version is the same as the
# release name, and it will attempt to add the .rpm files
# to the release assets.
#
# On every push to devel, devel.yml calls this workflow (once
# linux.yml has passed) to build the same packages with a pre-release
# package version (X.Y.Z~devN, see DEVEL_PACKAGE in
# cmake/packaging.cmake) and publish them to the rolling 'devel'
# prerelease, https://github.com/kpeeters/cadabra2/releases/tag/devel,
# through .github/actions/rolling-release.

name: Fedora package (GTK4)

on:
  release:
    types: [created]
  workflow_call:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
        arch:
          - { os: ubuntu-24.04,     name: x86_64 }
          - { os: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.arch.os }}
    name: Fedora ${{ matrix.fedora }} ${{ matrix.arch.name }}

    steps:
    # Full history, so that 'git rev-list --count' in cmake/version.cmake
    # gives the real commit serial.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull Fedora image
      run: docker pull fedora:${{ matrix.fedora }}

    - name: Set up GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Authenticate GitHub CLI
      run: gh auth setup-git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build RPM in Fedora container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           fedora:${{ matrix.fedora }} \
           bash -c "
             dnf install -y rpm-build make gcc-c++ git python3-devel cmake gmp-devel libuuid-devel sqlite-devel openssl-devel gtkmm4.0-devel boost-devel python3-matplotlib python3-pip
             git config --global --add safe.directory /workspace
             pip3 install sympy
             mkdir build
             cd build
             cmake -DPACKAGING_MODE=ON -DENABLE_MATHEMATICA=OFF -DCMAKE_INSTALL_PREFIX=/usr \
                   -DDEVEL_PACKAGE=${{ github.event_name == 'release' && 'OFF' || 'ON' }} ..
             make
             cpack
           "

    - name: Set version variables from output of cmake
      run: |
        VER=$(cat ${{ github.workspace }}/build/VERSION)
        echo "VERSION=$VER" >> $GITHUB_ENV

    - name: Upload Release Assets
      if:   github.event_name == 'release'
      run: |
        gh release upload "${{ env.VERSION }}" build/cadabra2-${{ env.VERSION }}-fedora${{ matrix.fedora }}-${{ matrix.arch.name }}.rpm --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Used by the devel-release and test jobs below.
    - name: Store package as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: rpm-fedora${{ matrix.fedora }}-${{ matrix.arch.name }}
        path: build/cadabra2-${{ env.VERSION }}-fedora${{ matrix.fedora }}-${{ matrix.arch.name }}.rpm
        if-no-files-found: error

  # Package names carry the version, so stale-suffix lists every
  # combination of the build matrix; it removes the package of a
  # previous version once a new one is uploaded.
  devel-release:
    needs: build
    if: github.event_name != 'release' && github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: rpm-fedora*
        merge-multiple: true
        path: dist
    - uses: ./.github/actions/rolling-release
      with:
        assets: dist/*.rpm
        stale-suffix: >-
          -fedora43-x86_64.rpm -fedora43-arm64.rpm -fedora44-x86_64.rpm -fedora44-arm64.rpm
        token: ${{ github.token }}

  # Installs the package just built (not the one on the release page)
  # in a fresh container, for release and devel builds alike.
  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    name: Test Fedora ${{ matrix.fedora }}

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull Fedora image
      run: docker pull fedora:${{ matrix.fedora }}

    - uses: actions/download-artifact@v4
      with:
        name: rpm-fedora${{ matrix.fedora }}-x86_64
        path: dist

    - name: Install package and run inside Fedora container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           fedora:${{ matrix.fedora }} \
           bash -c "
             dnf install -y xorg-x11-server-Xvfb
             dnf install -y ./dist/cadabra2-*.rpm
             printf 'import sys\nprint(sys.path)\nimport cdb.main\nex:=(A+B) (C+D);\ndistribute(ex);\nquit()\n' > tst.cdb
             cadabra2 tst.cdb

             # GTK4 picks a GL/Vulkan renderer by default, which fails
             # under Xvfb; force the cairo fallback.
             export GSK_RENDERER=cairo
             xvfb-run -a cadabra2-gtk &
             APP_PID=\$!
             sleep 20
             if kill -0 \$APP_PID 2>/dev/null; then
                echo 'cadabra2-gtk started successfully'
                kill \$APP_PID
                exit 0
             else
                echo 'cadabra2-gtk failed to start'
                exit 1
             fi
           "
