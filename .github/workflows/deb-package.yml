# Create GTK4 Ubuntu and Debian packages on a github release event,
# for all distributions listed in the 'dist' matrices below (add new
# releases to both the 'build' and 'test' lists). Ubuntu 22.04 is
# built with GTK3 by the separate ubuntu-22.04-package.yml file.
# This assumes that the cadabra version is the same as the
# release name, and it will attempt to add the .deb files
# to the release assets.

name: Ubuntu/Debian package (GTK4)

# on: [push]

on:
  release:
    types: [created]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        dist:
          - { image: "ubuntu:24.04", tag: "ubuntu-24.04-noble" }
          - { image: "ubuntu:26.04", tag: "ubuntu-26.04-resolute" }
          - { image: "debian:13",    tag: "debian-13-trixie" }
        arch:
          - { os: ubuntu-24.04,     name: x86_64 }
          - { os: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.arch.os }}
    name: ${{ matrix.dist.tag }} ${{ matrix.arch.name }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull distribution image
      run: docker pull ${{ matrix.dist.image }}

    - name: Set up GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Authenticate GitHub CLI
      run: gh auth setup-git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build .deb in container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           ${{ matrix.dist.image }} \
           bash -c "
             set -e
             apt-get update
             # Python packages come from apt, as pip installs into the
             # system Python are blocked (PEP 668).
             DEBIAN_FRONTEND=noninteractive apt-get install -y \
                  git cmake ninja-build g++ python3-dev \
                  libgmp-dev libgtkmm-4.0-dev libboost-all-dev \
                  libsqlite3-dev uuid-dev libtbb-dev libssl-dev \
                  python3-sympy python3-gmpy2 python3-numpy python3-matplotlib \
                  dpkg-dev file
             git config --global --add safe.directory /workspace
             mkdir build
             cd build
             cmake -G Ninja -DPACKAGING_MODE=ON -DENABLE_MATHEMATICA=OFF -DCMAKE_INSTALL_PREFIX=/usr ..
             cmake --build .
             cpack
           "

    - name: Set version variables from output of cmake
      run: |
        VER=$(cat ${{ github.workspace }}/build/VERSION)
        echo "VERSION=$VER" >> $GITHUB_ENV

    - name: Upload Release Assets
      if:   github.event_name == 'release'
      run: |
        gh release upload "${{ env.VERSION }}" build/cadabra2-${{ env.VERSION }}-${{ matrix.dist.tag }}-${{ matrix.arch.name }}.deb --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Store package as build artifact
      uses: actions/upload-artifact@v4
      if:   github.event_name == 'push'
      with:
        name: cadabra2-${{ matrix.dist.tag }}-${{ matrix.arch.name }}.deb
        path: build/cadabra2-${{ env.VERSION }}-${{ matrix.dist.tag }}-${{ matrix.arch.name }}.deb

  test:
    needs: build
    runs-on: ubuntu-latest
    if:   github.event_name == 'release' # only test release builds

    strategy:
      fail-fast: false
      matrix:
        dist:
          - { image: "ubuntu:24.04", tag: "ubuntu-24.04-noble" }
          - { image: "ubuntu:26.04", tag: "ubuntu-26.04-resolute" }
          - { image: "debian:13",    tag: "debian-13-trixie" }
    name: Test ${{ matrix.dist.tag }}

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull distribution image
      run: docker pull ${{ matrix.dist.image }}

    - name: Download package and run inside container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           ${{ matrix.dist.image }} \
           bash -c "
             set -e
             apt-get update
             DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth imagemagick wget curl jq
             export VERSION=\$(curl -s https://api.github.com/repos/kpeeters/cadabra2/releases|& jq .[0].tag_name -r)
             export DEBNAME=cadabra2-\${VERSION}-${{ matrix.dist.tag }}-x86_64.deb
             wget https://github.com/kpeeters/cadabra2/releases/download/\${VERSION}/\${DEBNAME}
             DEBIAN_FRONTEND=noninteractive apt-get install -y ./\${DEBNAME}
             printf 'import sys\nprint(sys.path)\nimport cdb.main\nex:=(A+B) (C+D);\ndistribute(ex);\nquit()\n' > tst.cdb
             cadabra2 tst.cdb

             # GTK4 picks a GL/Vulkan renderer by default, which fails
             # under Xvfb; force the cairo fallback.
             export GSK_RENDERER=cairo
             xvfb-run -n 99 -s '-screen 0 1920x1080x24 -ac' cadabra2-gtk -n &
             APP_PID=\$!
             sleep 20
             if kill -0 \$APP_PID 2>/dev/null; then
                echo 'cadabra2-gtk started successfully'
                DISPLAY=:99 import -window root /workspace/screenshot.png
                kill \$APP_PID
                exit 0
             else
                echo 'cadabra2-gtk failed to start'
                exit 1
             fi
           "

    - name: Upload screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-screenshot-${{ matrix.dist.tag }}
        path: screenshot.png
        if-no-files-found: warn
