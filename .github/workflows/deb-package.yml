# Create GTK4 Ubuntu and Debian packages on a github release event,
# for all distributions listed in the 'dist' matrices below (add new
# releases to both the 'build' and 'test' lists). Linux Mint 22.x users
# can install the Ubuntu 24.04 package: Mint 22 is built on noble, and
# a build in the linuxmintd/mint22.3-amd64 image produces the identical
# package (that image is a stock Ubuntu 24.04). Ubuntu 22.04 is
# built with GTK3 by the separate ubuntu-22.04-package.yml file.
# This assumes that the cadabra version is the same as the
# release name, and it will attempt to add the .deb files
# to the release assets.
#
# On every push to devel, devel.yml calls this workflow (once
# linux.yml has passed) to build the same packages with a pre-release
# package version (X.Y.Z~devN, see DEVEL_PACKAGE in
# cmake/packaging.cmake) and publish them to the rolling 'devel'
# prerelease, https://github.com/kpeeters/cadabra2/releases/tag/devel,
# through .github/actions/rolling-release.

name: Ubuntu/Debian package (GTK4)

on:
  release:
    types: [created]
  workflow_call:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        dist:
          - { image: "ubuntu:24.04", tag: "ubuntu-24.04-noble" }
          - { image: "ubuntu:26.04", tag: "ubuntu-26.04-resolute" }
          - { image: "debian:13",    tag: "debian-13-trixie" }
        arch:
          - { os: ubuntu-24.04,     name: x86_64 }
          - { os: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.arch.os }}
    name: ${{ matrix.dist.tag }} ${{ matrix.arch.name }}

    steps:
    # Full history, so that 'git rev-list --count' in cmake/version.cmake
    # gives the real commit serial.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull distribution image
      run: docker pull ${{ matrix.dist.image }}

    - name: Set up GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Authenticate GitHub CLI
      run: gh auth setup-git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build .deb in container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           ${{ matrix.dist.image }} \
           bash -c "
             set -e
             apt-get update
             # Python packages come from apt, as pip installs into the
             # system Python are blocked (PEP 668).
             DEBIAN_FRONTEND=noninteractive apt-get install -y \
                  git cmake ninja-build g++ python3-dev \
                  libgmp-dev libgtkmm-4.0-dev libboost-all-dev \
                  libsqlite3-dev uuid-dev libtbb-dev libssl-dev \
                  python3-sympy python3-gmpy2 python3-numpy python3-matplotlib \
                  dpkg-dev file
             git config --global --add safe.directory /workspace
             mkdir build
             cd build
             cmake -G Ninja -DPACKAGING_MODE=ON -DENABLE_MATHEMATICA=OFF -DCMAKE_INSTALL_PREFIX=/usr \
                   -DDEVEL_PACKAGE=${{ github.event_name == 'release' && 'OFF' || 'ON' }} ..
             cmake --build .
             cpack
           "

    - name: Set version variables from output of cmake
      run: |
        VER=$(cat ${{ github.workspace }}/build/VERSION)
        echo "VERSION=$VER" >> $GITHUB_ENV

    # Used by the devel-release and test jobs below.
    - name: Store package as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-${{ matrix.dist.tag }}-${{ matrix.arch.name }}
        path: build/cadabra2-${{ env.VERSION }}-${{ matrix.dist.tag }}-${{ matrix.arch.name }}.deb
        if-no-files-found: error

  # Package names carry the version, so stale-suffix lists every
  # dist-arch combination of the build matrix; it removes the package
  # of a previous version once a new one is uploaded.
  devel-release:
    needs: build
    if: github.event_name != 'release' && github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: deb-*
        merge-multiple: true
        path: dist
    - uses: ./.github/actions/rolling-release
      with:
        assets: dist/*.deb
        stale-suffix: >-
          -ubuntu-24.04-noble-x86_64.deb -ubuntu-24.04-noble-arm64.deb
          -ubuntu-26.04-resolute-x86_64.deb -ubuntu-26.04-resolute-arm64.deb
          -debian-13-trixie-x86_64.deb -debian-13-trixie-arm64.deb
        token: ${{ github.token }}

  # On a release event, uploads the packages to the release once they
  # have passed the tests. This is the only job of a release build
  # which can write to the repository.
  release-upload:
    needs: [build, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: deb-*
        merge-multiple: true
        path: dist
    - name: Upload release assets
      run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      env:
        GH_TOKEN: ${{ github.token }}

  # Installs the package just built (not the one on the release page)
  # in a fresh container, for release and devel builds alike.
  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dist:
          - { image: "ubuntu:24.04", tag: "ubuntu-24.04-noble" }
          - { image: "ubuntu:26.04", tag: "ubuntu-26.04-resolute" }
          - { image: "debian:13",    tag: "debian-13-trixie" }
    name: Test ${{ matrix.dist.tag }}

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master

    - name: Pull distribution image
      run: docker pull ${{ matrix.dist.image }}

    - uses: actions/download-artifact@v4
      with:
        name: deb-${{ matrix.dist.tag }}-x86_64
        path: dist

    - name: Install package and run inside container
      run: |
        docker run --rm \
           -v ${{ github.workspace }}:/workspace \
           -w /workspace \
           ${{ matrix.dist.image }} \
           bash -c "
             set -e
             apt-get update
             DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth imagemagick
             DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/cadabra2-*.deb
             printf 'import sys\nprint(sys.path)\nimport cdb.main\nex:=(A+B) (C+D);\ndistribute(ex);\nquit()\n' > tst.cdb
             cadabra2 tst.cdb

             # GTK4 picks a GL/Vulkan renderer by default, which fails
             # under Xvfb; force the cairo fallback.
             export GSK_RENDERER=cairo
             xvfb-run -n 99 -s '-screen 0 1920x1080x24 -ac' cadabra2-gtk -n &
             APP_PID=\$!
             sleep 20
             if kill -0 \$APP_PID 2>/dev/null; then
                echo 'cadabra2-gtk started successfully'
                DISPLAY=:99 import -window root /workspace/screenshot.png
                kill \$APP_PID
                exit 0
             else
                echo 'cadabra2-gtk failed to start'
                exit 1
             fi
           "

    - name: Upload screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-screenshot-${{ matrix.dist.tag }}
        path: screenshot.png
        if-no-files-found: warn
